name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and pack rbs_agent.jar
        run: |
          set -e
          VERSION=$(grep -o 'VERSION = "[^"]*"' src/rbs/RBSAgent.java | cut -d'"' -f2)
          rm -rf build && mkdir build
          javac -encoding UTF-8 --release 11 -Xlint:-options -d build src/rbs/*.java
          printf 'Manifest-Version: 1.0\nPremain-Class: rbs.RBSAgent\nCan-Retransform-Classes: false\n' > build/MANIFEST.MF
          jar cfm dist/rbs_agent.jar build/MANIFEST.MF -C build rbs
          (cd dist && zip -r "../RealBodyShapeZombiesPatch-v${VERSION}.zip" .)
          ls -la RealBodyShapeZombiesPatch-v${VERSION}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RealBodyShapeZombiesPatch
          path: RealBodyShapeZombiesPatch-v*.zip
